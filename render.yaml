services:
  - type: web
    name: truck-route-weather-api
    runtime: python
    rootDir: backend
    plan: free
    # Deploy only after the GitHub Actions checks on main pass.
    autoDeployTrigger: checksPass
    # Frontend-only changes do not redeploy the API.
    buildFilter:
      paths:
        - backend/**
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: TOMTOM_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: OPEN_METEO_API_KEY
        sync: false
