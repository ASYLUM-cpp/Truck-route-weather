[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"routing/tests/*" = ["E501"]

[tool.coverage.run]
source = ["routing"]
omit = ["routing/tests/*"]

[tool.coverage.report]
skip_empty = true
show_missing = true
